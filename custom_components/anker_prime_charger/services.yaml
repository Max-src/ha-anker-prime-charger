# Profile settings fields: defined once (in save_custom_profile), reused below
save_custom_profile:
  target:
    device:
      integration: anker_prime_charger
      model_id: A2345
  fields:
    profile:
      required: true
      example: test 1
      selector:
        text:
    new_name:
      example: Desk
      selector:
        text:
    from_charger:
      default: false
      selector:
        boolean:
    auto_deactivation: &auto_deactivation
      selector:
        boolean:
    c1_power: &c1_power
      selector:
        number:
          min: 0
          max: 140
          unit_of_measurement: W
          mode: box
    c2_power: &usb_c_power
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: W
          mode: box
    c3_power: *usb_c_power
    c4_power: *usb_c_power
    a_power: &a_power
      selector:
        select:
          options:
          - '0'
          - '15'
          - '24'
    c1_protocols: &protocols
      selector:
        select:
          multiple: true
          translation_key: protocol
          options:
          - scp
          - ufcs
          - pd12v
          - pps11v
          - pps16v
          - pps20v
          - huawei
          - xiaomi
    c2_protocols: *protocols
    c3_protocols: *protocols
    c4_protocols: *protocols
create_custom_profile:
  target:
    device:
      integration: anker_prime_charger
      model_id: A2345
  fields:
    name:
      required: true
      example: Travel
      selector:
        text: {}
    auto_deactivation: *auto_deactivation
    c1_power: *c1_power
    c2_power: *usb_c_power
    c3_power: *usb_c_power
    c4_power: *usb_c_power
    a_power: *a_power
    c1_protocols: *protocols
    c2_protocols: *protocols
    c3_protocols: *protocols
    c4_protocols: *protocols
set_custom_settings:
  target:
    device:
      integration: anker_prime_charger
      model_id: A2345
  fields:
    auto_deactivation: *auto_deactivation
    c1_power: *c1_power
    c2_power: *usb_c_power
    c3_power: *usb_c_power
    c4_power: *usb_c_power
    a_power: *a_power
    c1_protocols: *protocols
    c2_protocols: *protocols
    c3_protocols: *protocols
    c4_protocols: *protocols
delete_custom_profile:
  target:
    device:
      integration: anker_prime_charger
      model_id: A2345
  fields:
    profile:
      required: true
      example: test 1
      selector:
        text:
set_days:
  target:
    device:
      integration: anker_prime_charger
  fields:
    schedule:
      selector:
        select:
          translation_key: schedule_part
          options:
          - start
          - end
    days:
      example:
      - mon
      - wed
      - fri
      selector:
        select:
          multiple: true
          translation_key: weekday
          options:
          - mon
          - tue
          - wed
          - thu
          - fri
          - sat
          - sun
set_protocols:
  target:
    device:
      integration: anker_prime_charger
  fields:
    protocols: *protocols
