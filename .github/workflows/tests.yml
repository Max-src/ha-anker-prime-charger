name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # weekly: catch Home Assistant changes between our own commits
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
      - name: Ruff check
        run: ruff check custom_components tests tools
      - name: Ruff format
        run: ruff format --check custom_components tests tools

  pytest:
    # Each pytest-homeassistant-custom-component release pins one Home Assistant
    # version. "minimum" is the oldest we support (hacs.json), "stable" the
    # latest release; both must pass. "latest" takes whatever is newest (often
    # a beta): an early warning that may fail without blocking.
    name: Pytest (${{ matrix.name }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.name == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum
            package: pytest-homeassistant-custom-component==0.13.363  # HA 2026.9.0
          - name: stable
            package: pytest-homeassistant-custom-component==0.13.367  # HA 2026.9.4
          - name: latest
            package: pytest-homeassistant-custom-component
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "${{ matrix.package }}"
          pip install aiofiles cryptography paho-mqtt
      - name: Home Assistant version
        run: python -c "from homeassistant.const import __version__; print(__version__)"
      - name: Run tests
        run: pytest
